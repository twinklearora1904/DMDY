  <!-- Primary Meta Tags -->

  <meta property="twitter:title" content="DMDY — Digital Growth, Designed Around You." />
  <meta property="twitter:description" content="A 360° performance digital marketing consultancy driving predictable revenue through SEO, paid ads, and conversion optimization." />

<body>
  <div id="root">
    <div style="position:fixed;inset:0;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:system-ui,-apple-system,sans-serif;">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#00AED6,#E6007A,#F5A623);padding:2px;box-shadow:0 0 25px rgba(230,0,122,0.3);margin-bottom:20px;animation:spin 3s linear infinite;">
        <div style="width:100%;height:100%;background:#020617;border-radius:16px;display:flex;align-items:center;justify-content:center;">
          <img src="/favicon.png" alt="DMDY" style="width:36px;height:36px;object-fit:contain;" />
        </div>
      </div>
      <div style="color:#ffffff;font-size:20px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;">
        <span style="background:linear-gradient(90deg,#00AED6,#E6007A,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">DMDY</span>
        <span style="color:#94a3b8;font-size:14px;font-weight:600;margin-left:8px;">Digi Me Digi You</span>
      </div>
      <div style="color:#64748b;font-size:12px;font-weight:500;margin-bottom:20px;letter-spacing:0.5px;">
        360° Digital Growth Partner
      </div>
      <div style="width:180px;height:4px;background:#1e293b;border-radius:99px;overflow:hidden;position:relative;">
        <div style="width:40%;height:100%;background:linear-gradient(90deg,#00AED6,#E6007A,#F5A623);border-radius:99px;animation:load 1.2s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>

</html>
