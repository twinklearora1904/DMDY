<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded Modern Background Tile -->
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#borderGlow)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="150" cy="150" r="120" fill="#02AED6" opacity="0.12" filter="blur(40px)"/>
  <circle cx="362" cy="150" r="120" fill="#FDB21A" opacity="0.12" filter="blur(40px)"/>
  <circle cx="150" cy="362" r="120" fill="#E8107C" opacity="0.12" filter="blur(40px)"/>
  <circle cx="362" cy="362" r="120" fill="#11CD88" opacity="0.12" filter="blur(40px)"/>

  <!-- 1. Top-Left: D in Cyan -->
  <g transform="translate(60, 60)">
    <circle cx="85" cy="85" r="85" fill="#02AED6"/>
    <text x="85" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">D</text>
  </g>

  <!-- 2. Top-Right: M in Amber -->
  <g transform="translate(282, 60)">
    <circle cx="85" cy="85" r="85" fill="#FDB21A"/>
    <text x="85" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
  </g>

  <!-- 3. Bottom-Left: D in Magenta/Pink -->
  <g transform="translate(60, 282)">
    <circle cx="85" cy="85" r="85" fill="#E8107C"/>
    <text x="85" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">D</text>
  </g>

  <!-- 4. Bottom-Right: Y in Green -->
  <g transform="translate(282, 282)">
    <circle cx="85" cy="85" r="85" fill="#11CD88"/>
    <text x="85" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">Y</text>
  </g>

  <defs>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02AED6"/>
      <stop offset="35%" stop-color="#FDB21A"/>
      <stop offset="70%" stop-color="#E8107C"/>
      <stop offset="100%" stop-color="#11CD88"/>
    </linearGradient>
  </defs>
</svg>